[package]
name = "cataly"
version = "0.1.0"
edition = "2024"
description = "Native Cataly controller for stock oh-my-pi sessions"
license-file = "LICENSE"
repository = "https://github.com/vntrevx/Cataly"
publish = false

[[bin]]
name = "cataly"
path = "native/src/main.rs"

[features]
default = ["discord"]
discord = ["dep:futures-util", "dep:libproc", "dep:reqwest", "dep:rusqlite", "dep:tokio-tungstenite", "tokio/signal"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
futures-util = { version = "0.3", optional = true, default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.37", optional = true, features = ["bundled"] }
tokio-tungstenite = { version = "0.28", optional = true, features = ["rustls-tls-webpki-roots"] }
rustix = { version = "1.1", features = ["fs", "process"] }

# macOS process start, status and image path for the Discord receiver and activity identities, read through the
# same libproc calls as src/platform/darwin.ts; no command reports the start time's microseconds.
[target.'cfg(target_os = "macos")'.dependencies]
libproc = { version = "0.15", optional = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
