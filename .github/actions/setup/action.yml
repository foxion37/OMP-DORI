name: Setup Bun and dependencies
description: Install Bun 1.4.4, restore the Bun install cache, install the workspace dependencies and prepare the optional test fixtures.

inputs:
  fixtures:
    description: Test fixtures to prepare; none installs dependencies only, host binds the native OMP host, all also builds the native Cataly binary that hosts headless lanes.
    required: false
    default: none

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.4
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ inputs.fixtures }}-${{ hashFiles('bun.lock', 'skills/cataly-mode/scripts/bun.lock', 'test/fixtures/omp-native-host/bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ inputs.fixtures }}-
    - name: Install exact native OMP test host
      if: ${{ inputs.fixtures == 'host' || inputs.fixtures == 'all' }}
      shell: bash
      run: cd "$GITHUB_WORKSPACE/test/fixtures/omp-native-host" && bun install --frozen-lockfile
    - name: Bind exact native OMP test host
      if: ${{ inputs.fixtures == 'host' || inputs.fixtures == 'all' }}
      shell: bash
      run: |
        host="$GITHUB_WORKSPACE/test/fixtures/omp-native-host/node_modules/@oh-my-pi/pi-coding-agent"
        bun -e 'const p = await Bun.file(process.argv[1] + "/package.json").json(); const lock = await Bun.file("native-omp.lock").json(); if (p.version !== lock.nativeVersion) throw new Error("unexpected native OMP fixture version: " + p.version)' "$host"
        printf 'CATALY_TEST_OMP_ROOT=%s\n' "$host" >> "$GITHUB_ENV"
    - name: Install root dependencies
      shell: bash
      run: cd "$GITHUB_WORKSPACE" && bun install --frozen-lockfile
    - name: Install cataly-mode script dependencies
      shell: bash
      run: cd "$GITHUB_WORKSPACE/skills/cataly-mode/scripts" && bun install --frozen-lockfile
    - name: Build the native Cataly headless host
      if: ${{ inputs.fixtures == 'all' }}
      shell: bash
      run: |
        if ! command -v cargo >/dev/null; then
          echo "Headless lane, lead and duty tests run on the native Cataly binary; install stable Rust (https://rustup.rs)." >&2
          exit 1
        fi
        cargo --version
        cargo build --locked --release --bin cataly --manifest-path "$GITHUB_WORKSPACE/Cargo.toml"
        printf 'CATALY_DISCORD_NATIVE_BIN=%s\n' "$GITHUB_WORKSPACE/target/release/cataly" >> "$GITHUB_ENV"
