name: cross-os

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: Operating system to test; all runs both jobs.
        type: choice
        options: [all, macos, windows]
        default: all

permissions:
  contents: read

concurrency:
  group: cross-os-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-macos:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.os == 'all' || inputs.os == 'macos' }}
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
      - uses: ./.github/actions/setup
        with:
          fixtures: all
      - run: bun run check:fixtures
      - name: Root tests
        if: ${{ !cancelled() }}
        run: bun test --parallel=3 --timeout=30000 --timings=.bun-test-timings.json ./test/
      - name: Skill tests
        if: ${{ !cancelled() }}
        run: bun run test:skill
      - name: Extension tests
        if: ${{ !cancelled() }}
        run: bun run test:extension
      # The whole native suite, so every macOS-only Rust test runs somewhere: the launch-guard memory and disk readers
      # and the receiver and activity identities compare with the TypeScript readers through the bun setup put on PATH.
      - name: Native tests
        if: ${{ !cancelled() }}
        run: |
          bun --version
          cargo test --locked
      - name: Darwin arm64 headless consumer release
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          bun -e 'if (process.platform !== "darwin" || process.arch !== "arm64") throw new Error("Darwin arm64 is required")'
          gtar="$(command -v gtar)"
          "$gtar" --version
          git worktree add --detach "$RUNNER_TEMP/consumer-candidate" HEAD
          bun "$RUNNER_TEMP/consumer-candidate/scripts/verify-consumer-release.ts" \
            --source "$RUNNER_TEMP/consumer-candidate" \
            --tar-bin "$gtar" \
            --out "/private/tmp/odcr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

  test-windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.os == 'all' || inputs.os == 'windows' }}
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
        with:
          fixtures: host
      - run: bun run check
      - run: bun run typecheck
      - run: bun run knip
      - run: bun run lint:loc
      - name: Root tests
        if: ${{ !cancelled() }}
        run: bun run test:ci
      - name: Skill tests
        if: ${{ !cancelled() }}
        run: bun run test:skill
      - name: Extension tests
        if: ${{ !cancelled() }}
        run: bun run test:extension
