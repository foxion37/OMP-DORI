name: ULW update candidate

on:
  schedule:
    # 12:00 Asia/Seoul (KST, UTC+9). GitHub may delay scheduled runs.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ulw-update-candidate
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'vntrevx/Cataly'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.prepare.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Prepare exact ULW source candidate without executing upstream code
        id: prepare
        run: |
          bun scripts/update-ulw.ts --out "$RUNNER_TEMP/ulw-candidate"
          if [ -f "$RUNNER_TEMP/ulw-candidate/candidate.json" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: steps.prepare.outputs.changed == 'true'
        with:
          name: ulw-candidate
          path: ${{ runner.temp }}/ulw-candidate
          if-no-files-found: error
          retention-days: 7

  propose:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ulw-candidate
          path: ${{ runner.temp }}/ulw-candidate
      - name: Propose metadata-only draft and dispatch exact-head CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/update-ulw-publish.ts --from "$RUNNER_TEMP/ulw-candidate"
