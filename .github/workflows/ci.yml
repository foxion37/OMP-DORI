name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
        with:
          fixtures: all
      - run: bun run ci
      - name: Verify bound native session ownership
        timeout-minutes: 20
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/native-compatibility"
          mkdir -m 700 "$smoke" "$smoke/home"
          native=$(bun scripts/source-dependencies.ts native "$GITHUB_WORKSPACE" "$smoke/home")
          bun scripts/source-dependencies.ts assert-native "$GITHUB_WORKSPACE" "$smoke/home"
          version=$(HOME="$smoke/home" "$native/bin/omp" --version)
          test "$version" = "$(bun -e 'console.log((await Bun.file("native-omp.lock").json()).nativeVersion)')"
          CATALY_HEADLESS_SMOKE=1 CATALY_TEST_OMP_EXEC="$native/bin/omp" bun test ./test/runtime-headless-native.test.ts ./test/harness-native.test.ts
          (
            cd "$native/source"
            env -i HOME="$smoke/home" LANG=C.UTF-8 \
              PATH="$native/bin:$(dirname "$(command -v bun)"):/usr/bin:/bin" \
              bun test --timeout 15000 packages/coding-agent/test/agent-session-next-turn-ownership.test.ts
          )
          bun scripts/check-native-doctor.ts "$smoke/home"
