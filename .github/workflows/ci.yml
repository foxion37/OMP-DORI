name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
        with:
          fixtures: all
      - run: bun run ci
      - name: Verify bound native session ownership and ULW code-mode bridges
        timeout-minutes: 20
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/ulw-native-compatibility"
          mkdir -m 700 "$smoke" "$smoke/home"
          native=$(bun scripts/source-dependencies.ts native "$GITHUB_WORKSPACE" "$smoke/home")
          bun scripts/source-dependencies.ts assert-native "$GITHUB_WORKSPACE" "$smoke/home"
          version=$(HOME="$smoke/home" "$native/bin/omp" --version)
          test "$version" = '18.20.0'
          (
            cd "$native/source"
            env -i HOME="$smoke/home" LANG=C.UTF-8 \
              PATH="$native/bin:$(dirname "$(command -v bun)"):/usr/bin:/bin" \
              bun test --timeout 15000 packages/coding-agent/test/agent-session-next-turn-ownership.test.ts
          )
          for check in code-mode-host-check code-mode-task-host-check; do
            env -i HOME="$smoke/home" LANG=C.UTF-8 \
              PATH="$native/bin:$(dirname "$(command -v bun)"):/usr/bin:/bin" \
              bun "$GITHUB_WORKSPACE/ref/omp-ulw/tests/$check.ts"
          done

  e2e-herdr:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
        with:
          fixtures: none
      - name: Install herdr 0.9.5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/ci-install-herdr.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: herdr --version
      - run: bun test test/e2e.test.ts

  e2e-hc:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HC_SESSION: dori-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
        with:
          fixtures: none
      - name: Install hc 0.1.20
        run: |
          curl -fsSL https://releases.herdr.dev/core/install.sh | HC_VERSION=0.1.20 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: hc update --version 0.1.20
      - run: hc --version
      - name: hc e2e
        run: |
          test -f test/e2e-hc.test.ts
          bun test test/e2e-hc.test.ts
          test -f test/e2e-hc-deploy.test.ts
          bun test test/e2e-hc-deploy.test.ts
